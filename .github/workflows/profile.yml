name: profile

# Rebuilds everything dynamic in the README and publishes it to the `output`
# branch: the contribution snake, the 3D contribution graph and the live card
# (time, weather, site status). Hourly, on demand, and on every push to main.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: output-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#D97706&color_dots=#EBEDF0,#FBE3B5,#F5C878,#E9A53E,#C17A0E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F5B445&color_dots=#161B22,#2A2416,#5C4A1E,#A8802C,#F5B445

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Live card
        run: python3 scripts/live_card.py dist

      - name: Collect
        run: |
          cp profile-3d-contrib/profile-night-view.svg dist/contrib-3d-dark.svg
          cp profile-3d-contrib/profile-season-animate.svg dist/contrib-3d-light.svg
          ls -la dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
